<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSC 학과 성향 테스트 🎯</title>
    
    <!-- Google tag (gtag.js) - GA4 정확한 위치 적용완료 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-020J2KB24N"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-020J2KB24N');
    </script>

    <!-- 트렌디한 폰트 및 애니메이션 라이브러리 -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #ffffff;
            margin: 0;
            padding: 20px 15px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 32px 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        .badge {
            display: inline-block;
            background: linear-gradient(90deg, #ff007a, #9333ea);
            color: white;
            font-size: 13px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            letter-spacing: 1px;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(255, 0, 122, 0.5);
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            line-height: 1.4;
            margin: 0 0 10px 0;
            background: linear-gradient(180deg, #FFFFFF 0%, #CBD5E1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 28px;
        }
        .quiz-box {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 20px;
        }
        .question {
            font-size: 16px;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 18px;
            word-break: keep-all;
        }
        .btn {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 16px 20px;
            width: 100%;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            margin: 8px 0;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover, .btn:active {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5);
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }
        .btn-purple {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }
        .btn-purple:hover, .btn-purple:active {
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.5);
            background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%);
        }
        .btn-cta {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            font-size: 16px;
            padding: 18px 20px;
            margin-top: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        #result {
            display: none;
            background: rgba(15, 23, 42, 0.85);
            border-radius: 16px;
            padding: 24px 20px;
            border: 1px solid rgba(255, 0, 122, 0.3);
        }
        .result-title { font-size: 14px; color: #f43f5e; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .result-type { font-size: 24px; font-weight: 800; color: #ffffff; margin: 10px 0 15px 0; word-break: keep-all; }
        .result-desc { font-size: 14px; color: #cbd5e1; line-height: 1.6; word-break: keep-all; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="card animate__animated animate__fadeInUp">
        <span class="badge">GSC 글로벌시스템융합과 특별테스트</span>
        <h1>🔥 2027 내 성향에 딱 맞는<br>전공 유형은?</h1>
        <p class="subtitle">3초 만에 알아보는 나의 미래 잠재력 진단</p>
        
        <div id="quiz-container" class="quiz-box">
            <div class="question">Q. 대학 졸업 후, 내가 꿈꾸는 나의 진짜 모습은?</div>
            
            <button class="btn" onclick="showResult('글로벌 리더형', '세계 무대를 누비며 글로벌 기업과 대기업이 서로 모셔가는 핵심 인재!')">
                🚀 글로벌 기업이 탐내는 능력자 되기
            </button>
            <button class="btn btn-purple" onclick="showResult('실무 트렌드 세터형', '남들보다 빠르게 실무 감각 익히고 취업 성공하는 실속파!')">
                ⚡️ 남들보다 1년 먼저 취업 성공하기
            </button>
        </div>

        <div id="result" class="animate__animated animate__zoomIn">
            <div class="result-title">✨ TEST RESULT</div>
            <div id="type-text" class="result-type"></div>
            <div id="desc-text" class="result-desc"></div>
            
            <button class="btn btn-cta" onclick="goToDepartment()">
                👉 GSC 학과 공식 소개 & 혜택 보러가기
            </button>
        </div>
    </div>

    <script>
        // 학과 공식 홈페이지 주소
        const DEPT_URL = "https://gsc.yju.ac.kr/%ed%95%99%ea%b3%bc-%ec%86%8c%ea%b0%9c/";

        function showResult(type, desc) {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('type-text').innerText = type;
            document.getElementById('desc-text').innerText = desc;
            document.getElementById('result').style.display = 'block';
            
            // GA4 상호작용(버튼 클릭) 이벤트 전송
            if (typeof gtag === 'function') {
                gtag('event', 'click_test_option', {
                    'selected_type': type
                });
            }
        }

        function goToDepartment() {
            // GA4 최종 CTA 클릭 이벤트 전송 후 페이지 이동
            if (typeof gtag === 'function') {
                gtag('event', 'click_dept_link', {
                    'target_url': DEPT_URL
                });
            }
            window.location.href = DEPT_URL;
        }
    </script>
</body>
</html>
